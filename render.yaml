services:
  - type: web
    name: datum
    runtime: python
    plan: free
    buildCommand: "git clone --depth 1 https://github.com/sqlmapproject/sqlmap.git sqlmap"
    startCommand: "python3 datum_server.py"
    envVars:
      - key: DATUM_HOSTED
        value: "1"
      - key: DATUM_UI_PASSWORD
        sync: false   # set this in the Render dashboard — the app refuses scans without it in hosted mode
      - key: PYTHON_VERSION
        value: "3.12.3"
